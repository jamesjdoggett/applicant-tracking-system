{% extends "base.html" %}
{% block title %}Applications | Applicant Tracking System{% endblock %}
{% block content %}
  <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-3xl font-semibold">Application pipeline</h1>
    </div>
    <a class="btn btn-primary" href="{% url 'recruiting:application_create' %}">New application</a>
  </div>
  <form method="get" class="mb-6 flex flex-wrap items-end gap-4">
    <div>
      <label class="mb-2 block font-semibold" for="pipeline-search">Candidate name or email</label>
      <input class="input input-bordered" id="pipeline-search" type="search" name="q" value="{{ query }}">
    </div>
    <div>
      <label class="mb-2 block font-semibold" for="pipeline-opening">Opening</label>
      <select class="select select-bordered" id="pipeline-opening" name="opening">
        <option value="">All openings</option>
        {% for opening in openings %}
          <option value="{{ opening.pk }}" {% if opening_filter == opening.pk|stringformat:'s' %}selected{% endif %}>{{ opening.title }} (#{{ opening.pk }}, {{ opening.get_status_display }})</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="mb-2 block font-semibold" for="pipeline-stage">Stage</label>
      <select class="select select-bordered" id="pipeline-stage" name="stage">
        <option value="">All stages</option>
        {% for value, label in stages %}
          <option value="{{ value }}" {% if stage == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <button class="btn btn-primary" type="submit">Filter applications</button>
    <a class="btn btn-ghost" href="{% url 'recruiting:application_list' %}">Reset filters</a>
  </form>
  {% include "recruiting/partials/pipeline_results.html" %}
{% endblock %}
